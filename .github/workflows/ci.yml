name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    name: Android build and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run documentation checks
        run: ./gradlew checkDocs

      - name: Run debug unit tests
        run: >-
          ./gradlew
          :app:testMapDebugUnitTest
          :app:testNoMapDebugUnitTest
          :NetWork:testDebugUnitTest

      - name: Run release lint
        run: ./gradlew :app:lintMapRelease :app:lintNoMapRelease :NetWork:lintRelease

      - name: Run Kotlin static analysis
        run: ./gradlew :app:detekt :NetWork:detekt

      - name: Assemble debug and release variants
        run: >-
          ./gradlew
          :app:assembleMapDebug
          :app:assembleNoMapDebug
          :app:assembleMapRelease
          :app:assembleNoMapRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TJI_Platform-debug-apks
          path: |
            app/build/outputs/apk/map/debug/*.apk
            app/build/outputs/apk/map/debug/output-metadata.json
            app/build/outputs/apk/noMap/debug/*.apk
            app/build/outputs/apk/noMap/debug/output-metadata.json
          if-no-files-found: error

      - name: Upload release deobfuscation evidence
        uses: actions/upload-artifact@v4
        with:
          name: TJI_Platform-release-symbols-${{ github.sha }}
          path: |
            app/build/outputs/mapping/mapRelease/mapping.txt
            app/build/outputs/mapping/noMapRelease/mapping.txt
            app/build/outputs/native-debug-symbols/mapRelease/native-debug-symbols.zip
            app/build/outputs/native-debug-symbols/noMapRelease/native-debug-symbols.zip
          if-no-files-found: error

  speaker-core:
    name: speaker-core CTest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Configure
        run: cmake -S native/speaker-core -B native/speaker-core/build-ci -G Ninja

      - name: Build
        run: cmake --build native/speaker-core/build-ci

      - name: Run CTest
        run: ctest --test-dir native/speaker-core/build-ci --output-on-failure

      - name: Upload CTest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaker-core-ctest-output
          path: native/speaker-core/build-ci/Testing
          if-no-files-found: warn
